# Self-hosting compose file. The primary deployment is AWS Lambda
# (deploy/deploy.sh); use this only if you would rather run it yourself.
#
# Note: behind Docker the API is plain HTTP. Put it behind a reverse proxy with
# TLS (Caddy, nginx) before exposing it to the internet — iOS Shortcuts should
# not be sending your API key over an unencrypted connection.

services:
  api:
    build: .
    container_name: myq-api
    ports:
      - "8000:8000"
    volumes:
      - ./myq_tokens.json:/app/myq_tokens.json
      - ./.env:/app/.env:ro
    environment:
      - TZ=America/New_York
    restart: unless-stopped
